name: Daily edge Terraform plan

on:
  schedule:
    - cron: "0 3 * * *"
      timezone: America/Chicago
  workflow_dispatch:

concurrency:
  group: daily-edge-terraform-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Check AWS edge resources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/aws
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required repository variables
        env:
          ROLE_ARN: ${{ vars.EDGE_TERRAFORM_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo 'Set EDGE_TERRAFORM_PLAN_ROLE_ARN as an Actions repository variable.' >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.EDGE_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          github-token: ${{ github.token }}

      - name: Render Terraform inputs
        run: nix eval --json --file ../inputs.nix | jq -e '.awsEdge' > terraform.auto.tfvars.json

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Initialize Terraform
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config=bucket=rui-terraform-state-997229934634-us-east-1 \
            -backend-config=key=edge/aws/terraform.tfstate \
            -backend-config=region=us-east-1

      - name: Check for proposed changes
        run: |
          if terraform plan -input=false -no-color -detailed-exitcode -lock-timeout=5m; then
            echo 'Terraform proposes no changes to the AWS edge resources.' >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            case "$status" in
              2)
                echo 'Terraform proposes AWS edge changes. Review the plan output; changes may reflect drift or a newer AMI.' >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              1)
                echo 'Terraform could not complete the AWS edge plan. Review the job log.' >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              *)
                echo "Terraform returned unexpected exit status $status." >&2
                exit "$status"
                ;;
            esac
          fi

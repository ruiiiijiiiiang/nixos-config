name: Deploy to Host
on:
  workflow_dispatch:
    inputs:
      target_host:
        description: "Target Host (Flake Output)"
        required: true
        type: choice
        default: vm-app
        options:
          - cloud-observe
          - pi
          - hypervisor
          - vm-app
          - vm-cyber
          - vm-monitor
          - vm-network
          - vm-public
      deploy_mode:
        description: "Deploy mode (switch now or boot on next reboot)"
        required: true
        type: choice
        default: switch
        options:
          - switch
          - boot

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ inputs.target_host == 'pi' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          github-token: ${{ github.token }}

      - name: Resolve host IP address
        id: destination
        uses: ./.github/actions/resolve-host-ip
        with:
          host: ${{ inputs.target_host }}

      - name: Resolve vm-app address
        id: cache-host
        uses: ./.github/actions/resolve-host-ip
        with:
          host: vm-app

      - name: Install and Connect WireGuard
        uses: ./.github/actions/connect-wireguard
        with:
          config: ${{ secrets.WG_CONF }}

      - name: Configure Harmonia cache
        uses: ./.github/actions/configure-harmonia
        with:
          host-ip: ${{ steps.cache-host.outputs.ip }}

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          host-ip: ${{ steps.destination.outputs.ip }}

      - name: Setup SSH for vm-app
        uses: ./.github/actions/setup-ssh
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          host-ip: ${{ steps.cache-host.outputs.ip }}

      - name: Build system closure
        id: build
        env:
          TARGET_HOST: ${{ inputs.target_host }}
        run: |
          store_path=$(nix build \
            --no-update-lock-file \
            --no-link \
            --print-out-paths \
            ".#nixosConfigurations.$TARGET_HOST.config.system.build.toplevel")
          echo "store_path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Copy closure to vm-app
        env:
          STORE_PATH: ${{ steps.build.outputs.store_path }}
          VM_APP_IP: ${{ steps.cache-host.outputs.ip }}
        run: nix copy --no-check-sigs --to "ssh-ng://root@$VM_APP_IP" "$STORE_PATH"

      - name: Pin closure for Harmonia
        env:
          TARGET_HOST: ${{ inputs.target_host }}
          STORE_PATH: ${{ steps.build.outputs.store_path }}
          VM_APP_IP: ${{ steps.cache-host.outputs.ip }}
        run: |
          ssh -o BatchMode=yes "root@$VM_APP_IP" \
            bash -s -- "$TARGET_HOST" "$STORE_PATH" <<'REMOTE'
          set -euo pipefail
          host=$1
          store_path=$2
          root=/var/lib/nix-cache-roots
          test -d "$root"
          test -d "$store_path"
          tmp=$(mktemp -d "$root/.${host}.XXXXXX")
          ln -s "$store_path" "$tmp/link"
          mv -Tf "$tmp/link" "$root/$host"
          rmdir "$tmp"
          REMOTE

      - name: Copy closure to target host
        env:
          STORE_PATH: ${{ steps.build.outputs.store_path }}
          TARGET_IP: ${{ steps.destination.outputs.ip }}
        run: nix copy --no-check-sigs --to "ssh-ng://root@$TARGET_IP" "$STORE_PATH"

      - name: NixOS Rebuild (${{ inputs.deploy_mode }})
        env:
          NIX_SSHOPTS: "-o StrictHostKeyChecking=no"
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          STORE_PATH: ${{ steps.build.outputs.store_path }}
        run: |
          nix run github:nixos/nixpkgs/nixos-unstable#nixos-rebuild -- "$DEPLOY_MODE" \
            --store-path "$STORE_PATH" \
            --target-host "ssh-ng://root@${{ steps.destination.outputs.ip }}" \
            --use-substitutes \
            --no-reexec \
            --show-trace

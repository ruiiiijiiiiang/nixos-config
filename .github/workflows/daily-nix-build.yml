name: Daily Nix build

on:
  schedule:
    - cron: "30 5 * * *"
      timezone: America/Chicago
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-nix-build
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.host }}
    runs-on: ${{ matrix.host == 'pi' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host:
          - cloud-observe
          - desktop
          - framework
          - hypervisor
          - pi
          - vm-network
          - vm-app
          - vm-monitor
          - vm-public
    steps:
      - name: Check out mirrored commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          github-token: ${{ github.token }}

      - name: Evaluate locked system path
        id: expected
        run: |
          store_path=$(nix eval \
            --raw \
            --no-update-lock-file \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.outPath")
          echo "store_path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Resolve vm-app address
        id: destination
        uses: ./.github/actions/resolve-host-ip
        with:
          host: vm-app

      - name: Connect to home network
        uses: ./.github/actions/connect-wireguard
        with:
          config: ${{ secrets.WG_CONF }}

      - name: Configure Harmonia cache
        uses: ./.github/actions/configure-harmonia
        with:
          host-ip: ${{ steps.destination.outputs.ip }}

      - name: Configure SSH
        uses: ./.github/actions/setup-ssh
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          host-ip: ${{ steps.destination.outputs.ip }}

      - name: Check vm-app store
        id: cache
        env:
          STORE_PATH: ${{ steps.expected.outputs.store_path }}
          VM_APP_IP: ${{ steps.destination.outputs.ip }}
        run: |
          if ssh -o BatchMode=yes "root@$VM_APP_IP" nix path-info "$STORE_PATH" > /dev/null 2>&1; then
            echo 'hit=true' >> "$GITHUB_OUTPUT"
            echo "Already in Harmonia: $STORE_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "Could not check the vm-app store (SSH exit status $status)." >&2
              exit "$status"
            fi
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build missing system closure
        if: steps.cache.outputs.hit != 'true'
        run: |
          built_path=$(nix build \
            --no-update-lock-file \
            --no-link \
            --print-out-paths \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel")
          test "$built_path" = "${{ steps.expected.outputs.store_path }}"
          echo "Built ${{ matrix.host }} from $GITHUB_SHA: $built_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Copy closure to vm-app
        if: steps.cache.outputs.hit != 'true'
        env:
          STORE_PATH: ${{ steps.expected.outputs.store_path }}
          VM_APP_IP: ${{ steps.destination.outputs.ip }}
        run: nix copy --to "ssh://root@$VM_APP_IP" "$STORE_PATH"

      - name: Pin closure for Harmonia
        env:
          STORE_PATH: ${{ steps.expected.outputs.store_path }}
          VM_APP_IP: ${{ steps.destination.outputs.ip }}
        run: |
          ssh -o BatchMode=yes "root@$VM_APP_IP" \
            bash -s -- "${{ matrix.host }}" "$STORE_PATH" <<'REMOTE'
          set -euo pipefail
          host=$1
          store_path=$2
          root=/var/lib/nix-cache-roots
          test -d "$root"
          test -d "$store_path"
          tmp=$(mktemp -d "$root/.${host}.XXXXXX")
          ln -s "$store_path" "$tmp/link"
          mv -Tf "$tmp/link" "$root/$host"
          rmdir "$tmp"
          REMOTE

  report:
    name: Report build result
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check all host builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          NTFY_TOKEN: ${{ secrets.HARMONIA_NTFY_TOKEN }}
        run: |
          if [ "$BUILD_RESULT" != success ]; then
            echo "One or more host builds or cache transfers failed. See the host jobs above." >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$NTFY_TOKEN" ]; then
              echo "HARMONIA_NTFY_TOKEN is required for failure alerts." >&2
              exit 1
            fi
            curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $NTFY_TOKEN" \
              -H "Title: Nix build failures" \
              -H "Priority: high" \
              -H "Tags: warning,computer" \
              -H "Click: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              -d "Daily Nix build failed for $GITHUB_SHA. Open the run to see which hosts failed." \
              https://ntfy.ruijiang.me/harmonia-alerts
            exit 1
          fi
          echo "All host closures were copied and pinned on vm-app." >> "$GITHUB_STEP_SUMMARY"

name: Daily Cloudflare DNS Terraform plan

on:
  schedule:
    - cron: "15 3 * * *"
      timezone: America/Chicago
  workflow_dispatch:

concurrency:
  group: daily-cloudflare-dns-terraform-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Check Cloudflare DNS records
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/cloudflare/dns
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_DNS_ZONE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required credentials
        env:
          ROLE_ARN: ${{ vars.CLOUDFLARE_DNS_TERRAFORM_PLAN_ROLE_ARN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_READ_TOKEN }}
        run: |
          if [ -z "$ROLE_ARN" ] || [ -z "$TF_VAR_cloudflare_zone_id" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Set CLOUDFLARE_DNS_TERRAFORM_PLAN_ROLE_ARN and CLOUDFLARE_DNS_ZONE_ID as repository variables, and CLOUDFLARE_DNS_READ_TOKEN as a repository secret.' >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.CLOUDFLARE_DNS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Initialize Terraform
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config=bucket=rui-terraform-state-997229934634-us-east-1 \
            -backend-config=key=cloudflare/ruijiang.me/dns/terraform.tfstate \
            -backend-config=region=us-east-1

      - name: Check for proposed changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_READ_TOKEN }}
        run: |
          if terraform plan -input=false -no-color -detailed-exitcode -lock-timeout=5m; then
            echo 'Terraform proposes no changes to the Cloudflare DNS records.' >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            case "$status" in
              2)
                echo 'Terraform proposes Cloudflare DNS changes. Review the plan output for configuration changes or drift.' >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              1)
                echo 'Terraform could not complete the Cloudflare DNS plan. Review the job log.' >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              *)
                echo "Terraform returned unexpected exit status $status." >&2
                exit "$status"
                ;;
            esac
          fi

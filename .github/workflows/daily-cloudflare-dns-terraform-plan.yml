name: Daily Cloudflare DNS Terraform plan

on:
  schedule:
    - cron: "15 3 * * *"
      timezone: America/Chicago
  workflow_dispatch:

concurrency:
  group: daily-cloudflare-dns-terraform-plan
  cancel-in-progress: false

jobs:
  plan:
    name: Check Cloudflare DNS records
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/cloudflare
    env:
      TF_IN_AUTOMATION: "true"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required variables and credentials
        env:
          ROLE_ARN: ${{ vars.CLOUDFLARE_DNS_TERRAFORM_PLAN_ROLE_ARN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_READ_TOKEN }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ] || [ -z "$TF_STATE_REGION" ]; then
            echo 'Set TF_STATE_BUCKET and TF_STATE_REGION as Actions repository variables.' >&2
            exit 1
          fi
          if [ -z "$ROLE_ARN" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Set CLOUDFLARE_DNS_TERRAFORM_PLAN_ROLE_ARN as a repository variable and CLOUDFLARE_DNS_READ_TOKEN as a repository secret.' >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.CLOUDFLARE_DNS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.TF_STATE_REGION }}

      - name: Install Nix
        uses: ./.github/actions/install-nix
        with:
          github-token: ${{ github.token }}

      - name: Render Terraform inputs
        run: |
          nix eval --json --file ../inputs.nix \
            --apply 'inputs: inputs.cloudflareDns' > terraform.auto.tfvars.json

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Initialize Terraform
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config=key=cloudflare/ruijiang.me/dns/terraform.tfstate \
            -backend-config="region=$TF_STATE_REGION"

      - name: Assess drift and health checks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_READ_TOKEN }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/terraform-health.py" \
            --label "Cloudflare DNS"

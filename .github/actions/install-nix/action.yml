name: Install Nix
description: Install Nix with GitHub access and the Harmonia cache
inputs:
  github-token:
    description: GitHub token for fetching Nix flake inputs
    required: true
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          access-tokens = github.com=${{ inputs.github-token }}
          extra-substituters = https://cache.ruijiang.me
          extra-trusted-public-keys = cache.ruijiang.me-1:uSB517/xV6UnlCkzOYvmCSRG0sOqPPAGla5tY4iSQf0=

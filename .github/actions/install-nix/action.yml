name: Install Nix
description: Install Nix with GitHub access
inputs:
  github-token:
    description: GitHub token for fetching Nix flake inputs
    required: true
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          access-tokens = github.com=${{ inputs.github-token }}

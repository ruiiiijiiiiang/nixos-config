name: Connect WireGuard
description: Install WireGuard and connect to the home network
inputs:
  config:
    description: WireGuard configuration
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        WG_CONF: ${{ inputs.config }}
      run: |
        sudo apt-get update
        sudo apt-get install -y wireguard-tools
        sudo install -m 600 /dev/null /etc/wireguard/wg0.conf
        printf '%s\n' "$WG_CONF" | sudo tee /etc/wireguard/wg0.conf > /dev/null
        sudo wg-quick up wg0
